apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/psarangi550/argocd-example-apps.git'
    targetRevision: HEAD
    # path: nginx-app
    path: nginx
    helm:
      valuesObject:
        fullnameOverride: nginx-service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true