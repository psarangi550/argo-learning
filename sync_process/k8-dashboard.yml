apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/   # Helm repo, not a Git repo
    chart: headlamp                                        # chart name
    targetRevision: 0.45.0                                 # chart version — exactly ONE targetRevision
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true